[project]
name = "document-qa-assistant"
version = "0.1.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src", "backend/tests", "scripts"]
markers = ["integration: needs live AWS credentials / paid model calls (skipped by default)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101"]
"eval/*" = ["E501", "S101"]  # long lines are report text

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "backend/src"
ignore_missing_imports = true
