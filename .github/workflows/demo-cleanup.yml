name: Demo cleanup (daily safety net)

# Destroys anything a demo run left behind (crashed runner, failed destroy, forgotten run), then
# looks for leftover tagged resources and fails loudly (GitHub emails you) if any remain.
# It only ever touches the DEMO state, never a real dev deployment. It shares the "demo-stack"
# concurrency group with demo.yml, so it waits for a running demo instead of killing it.
# Note: GitHub pauses scheduled workflows after 60 days without repository activity.
on:
  schedule:
    - cron: "17 7 * * *" # 07:17 UTC daily (an off-peak minute)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-stack
  cancel-in-progress: false

jobs:
  cleanup:
    name: Destroy leftovers
    # Scheduled runs use the default branch; a manual run must also be on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: demo
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require repository variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          PERMISSIONS_BOUNDARY_ARN: ${{ vars.PERMISSIONS_BOUNDARY_ARN }}
          GENERATION_MODEL_ID: ${{ vars.GENERATION_MODEL_ID }}
          GENERATION_MODEL_ARNS: ${{ vars.GENERATION_MODEL_ARNS }}
        run: |
          missing=0
          for v in AWS_REGION TF_STATE_BUCKET AWS_DEPLOY_ROLE_ARN PERMISSIONS_BOUNDARY_ARN GENERATION_MODEL_ID GENERATION_MODEL_ARNS; do
            if [ -z "${!v}" ]; then echo "::error::Repository variable $v is not set (see docs/CICD.md)"; missing=1; fi
          done
          exit "$missing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/destroy-demo
        with:
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          region: ${{ vars.AWS_REGION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          permissions-boundary-arn: ${{ vars.PERMISSIONS_BOUNDARY_ARN }}
          generation-model-id: ${{ vars.GENERATION_MODEL_ID }}
          generation-model-arns: ${{ vars.GENERATION_MODEL_ARNS }}

      # Independent of Terraform state: anything still tagged as this app's Terraform-managed stack
      # (the bootstrap resources are tagged differently and are not matched).
      - name: Look for leftover resources by tag
        env:
          REGION: ${{ vars.AWS_REGION }}
        run: |
          find_left() {
            for r in "$REGION" us-east-1; do # us-east-1 also covers global services (CloudFront, IAM)
              aws resourcegroupstaggingapi get-resources --region "$r" \
                --tag-filters Key=Application,Values=document-qa-assistant Key=ManagedBy,Values=terraform \
                --query 'ResourceTagMappingList[].ResourceARN' --output text | tr '\t' '\n'
            done | sort -u | grep -v '^$' || true
          }
          left=$(find_left)
          if [ -n "$left" ]; then
            echo "Tag index can lag a few minutes; checking again in 90 seconds..."
            sleep 90
            left=$(find_left)
          fi
          if [ -n "$left" ]; then
            echo "::error::Resources are still tagged as this app after cleanup:"
            echo "$left"
            { echo "### Leftover resources"; echo '```'; echo "$left"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "No leftover resources." | tee -a "$GITHUB_STEP_SUMMARY"
