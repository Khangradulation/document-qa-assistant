name: Deploy (dev)

# Order: gate -> CI checks -> terraform PLAN (read-only role) -> human approval
#        -> terraform APPLY -> frontend deploy -> smoke tests.
# AWS access is via GitHub OIDC (no stored keys). Setup steps: docs/CICD.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Rollback: commit SHA or tag to deploy. Empty = head of this branch."
        required: false
        default: ""
      allow_destructive:
        description: "Allow the plan to destroy/replace data-bearing resources (vector index, buckets, table, user pool)."
        type: boolean
        default: false

permissions:
  contents: read

# One deployment at a time; never cancel one half-way through an apply.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_generation_model_id: ${{ vars.GENERATION_MODEL_ID }}
  TF_VAR_permissions_boundary_arn: ${{ vars.PERMISSIONS_BOUNDARY_ARN }}

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.decide.outputs.enabled }}
    steps:
      - id: decide
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Deployments run only from main (this run is on $REF)."
            exit 1
          fi
          # Pushes deploy only after you set the repository variable DEPLOY_ENABLED=true.
          # A manual run is explicit intent and always proceeds.
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$DEPLOY_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### Deployment skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Repository variable DEPLOY_ENABLED is not 'true'. Finish the setup in docs/CICD.md, then set it." >> "$GITHUB_STEP_SUMMARY"
          fi

  checks:
    name: CI checks
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  plan:
    name: Terraform plan
    needs: [gate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # lets THIS job request an OIDC token; no other job here gets it
    steps:
      - name: Require repository variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          GENERATION_MODEL_ID: ${{ vars.GENERATION_MODEL_ID }}
          PERMISSIONS_BOUNDARY_ARN: ${{ vars.PERMISSIONS_BOUNDARY_ARN }}
        run: |
          missing=0
          for v in AWS_REGION TF_STATE_BUCKET AWS_PLAN_ROLE_ARN AWS_DEPLOY_ROLE_ARN GENERATION_MODEL_ID PERMISSIONS_BOUNDARY_ARN; do
            if [ -z "${!v}" ]; then echo "::error::Repository variable $v is not set (see docs/CICD.md)"; missing=1; fi
          done
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Build Lambda package (reproducible)
        run: python scripts/build_lambda.py
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}

      - name: terraform init
        working-directory: infra
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: terraform init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$REGION"

      - name: terraform plan
        working-directory: infra
        run: |
          terraform plan -input=false -lock-timeout=5m -out=tfplan
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json

      - name: Review the plan (summary + destructive-change guard)
        working-directory: infra
        env:
          ALLOW_DESTRUCTIVE: ${{ inputs.allow_destructive }}
        run: |
          counts=$(jq -r '[.resource_changes[].change.actions | join("+")] | group_by(.) | map("\(.[0]): \(length)") | join(", ")' plan.json)
          {
            echo "### Terraform plan"
            echo "Resource actions: ${counts:-none}"
            echo '```'
            head -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Anything that destroys or REPLACES a data-bearing resource needs an explicit opt-in.
          risky=$(jq -r '.resource_changes[]
            | select(.change.actions | index("delete"))
            | select(.type | IN("aws_s3vectors_index","aws_s3vectors_vector_bucket","aws_s3_bucket","aws_dynamodb_table","aws_cognito_user_pool"))
            | .address' plan.json)
          if [ -n "$risky" ]; then
            echo "::warning::Plan destroys or replaces data-bearing resources:"
            echo "$risky"
            if [ "$ALLOW_DESTRUCTIVE" != "true" ]; then
              echo "::error::Refusing. Re-run manually with allow_destructive=true if this is intended."
              exit 1
            fi
          fi

      # The saved plan + the exact zip it was computed against travel together,
      # so the apply job executes precisely what was reviewed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ github.run_id }}
          path: |
            infra/tfplan
            infra/plan.txt
            infra/build/lambda.zip
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Approve, apply, deploy frontend, smoke test
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Required reviewers on this GitHub Environment = the human approval step.
    # Its name is also part of the AWS role's trust condition.
    environment:
      name: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ github.run_id }}
          path: infra

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: terraform apply (the reviewed plan, nothing else)
        working-directory: infra
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          terraform init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$REGION"
          terraform apply -input=false -lock-timeout=5m tfplan
          terraform output -json > outputs.json

      - name: Build frontend with the real backend settings
        env:
          REGION: ${{ vars.AWS_REGION }}
        run: |
          # Public identifiers only (API URL, Cognito pool/client IDs). No secrets exist here.
          jq --arg region "$REGION" '{demo: false, apiUrl: .api_url.value, region: $region,
              userPoolId: .cognito_user_pool_id.value, clientId: .cognito_client_id.value}' \
            infra/outputs.json > frontend/public/config.json
          cd frontend
          npm ci
          npm run build

      - name: Publish frontend (assets first, entry points last)
        run: |
          BUCKET=$(jq -r '.frontend_bucket.value' infra/outputs.json)
          DIST=$(jq -r '.cloudfront_distribution_id.value' infra/outputs.json)
          aws s3 sync frontend/dist "s3://$BUCKET" --delete \
            --exclude index.html --exclude config.json \
            --cache-control "public,max-age=31536000,immutable"
          for f in index.html config.json; do
            aws s3 cp "frontend/dist/$f" "s3://$BUCKET/$f" --cache-control "no-cache"
          done
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths /index.html /config.json > /dev/null

      - name: Smoke tests (fails the deployment if anything is wrong)
        run: python scripts/smoke_test.py infra/outputs.json

      - name: Record what was deployed
        if: always()
        env:
          DEPLOYED_SHA: ${{ inputs.git_ref || github.sha }}
        run: |
          {
            echo "### Deployment"
            echo "- Commit: \`$DEPLOYED_SHA\`"
            echo "- Frontend: $(jq -r '.frontend_url.value // "n/a"' infra/outputs.json 2>/dev/null)"
            echo "- API: $(jq -r '.api_url.value // "n/a"' infra/outputs.json 2>/dev/null)"
            echo "- Rollback: re-run this workflow manually with git_ref set to the previous good commit (docs/CICD.md)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$DEPLOYED_SHA" > infra/deployed_sha.txt

      # Outputs hold names/URLs only (never secrets): safe to keep for 30 days as rollback evidence.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deployment-${{ github.run_id }}
          path: |
            infra/outputs.json
            infra/deployed_sha.txt
          if-no-files-found: ignore
          retention-days: 30
